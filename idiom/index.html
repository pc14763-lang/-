let currentPlayer='',round=[],correctCount=0,attemptCount=0,questionLocked=false,timerId=null,timeLeft=12,sentenceTarget=null;
const MAX_ATTEMPTS=10,NEED_CORRECT=5,QUESTION_SECONDS=12;
const $=s=>document.querySelector(s);
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getPlayer(n){if(!store.players[n])store.players[n]={stars:0,plays:{},redeemed:0};const p=store.players[n];if(typeof p.stars!=='number')p.stars=0;if(!p.idiomPlays)p.idiomPlays={};if(!Array.isArray(p.idiomRecent))p.idiomRecent=[];return p}

function idiomRemaining(n){return Math.max(0,(+store.settings.dailyLimit||3)-idiomPlaysToday(n))}
function consumeIdiomPlay(){if(!currentPlayer||idiomRemaining(currentPlayer)<=0)return false;const p=getPlayer(currentPlayer),k=todayKey();p.idiomPlays[k]=(p.idiomPlays[k]||0)+1;save();return true}

function selectPlayer(n){currentPlayer=n;getPlayer(n);if(!consumeIdiomPlay()){alert('今天的成語冒險次數用完囉！明天再來 ⭐');renderPlayers();return}$('#selectLayer').style.display='none';updateHud();startRound()}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function makeRound(){const p=getPlayer(currentPlayer);const recent=new Set(p.idiomRecent.slice(-20));let pool=bank.filter(q=>!recent.has(q.idiom));if(pool.length<MAX_ATTEMPTS)pool=[...bank];const chosen=shuffle(pool).slice(0,MAX_ATTEMPTS);p.idiomRecent=[...p.idiomRecent,...chosen.map(q=>q.idiom)].slice(-30);save();return chosen}

function startTimer(){clearInterval(timerId);timeLeft=QUESTION_SECONDS;const t=$('#timer');t.textContent='⏱️ '+timeLeft;t.classList.remove('danger');timerId=setInterval(()=>{timeLeft--;t.textContent='⏱️ '+timeLeft;if(timeLeft<=5)t.classList.add('danger');if(timeLeft<=0){clearInterval(timerId);failQuestion('⏰ 時間到！換下一題。')}},1000)}
function showQuestion(){if(correctCount>=NEED_CORRECT)return finishBridge();if(attemptCount>=MAX_ATTEMPTS)return failRound();questionLocked=false;const q=round[attemptCount];$('#num').textContent=attemptCount+1;$('#qmain').textContent=q.show;$('#hint').textContent='💡 '+q.hint;spawnLogs(q);startTimer()}
function spawnLogs(q){const river=$('#river');river.querySelectorAll('.log').forEach(x=>x.remove());shuffle(q.opts).forEach((txt,i)=>{const l=document.createElement('button');l.className='log';l.textContent=txt;l.style.top=(55+i*95)+'px';l.style.left=(-140-(i*60))+'px';l.style.animationDuration=(7.2+i*.9)+'s';l.style.animationDelay=(-i*1.4)+'s';l.onclick=()=>answer(txt,l,q);river.appendChild(l)})}
function popStars(x,y){for(let i=0;i<4;i++){const s=document.createElement('div');s.className='starsPop';s.textContent='⭐';s.style.left=(x+Math.random()*60-30)+'px';s.style.top=(y+Math.random()*30-15)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function say(t,good=true){const m=$('#msg');m.textContent=t;m.style.display='block';m.style.background=good?'#efffdc':'#ffe0e0';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',1400)}
function advanceQuestion(){attemptCount++;renderBridge();setTimeout(showQuestion,850)}
function failQuestion(msg){if(questionLocked)return;questionLocked=true;clearInterval(timerId);say(msg,false);advanceQuestion()}
function answer(txt,el,q){if(questionLocked)return;questionLocked=true;clearInterval(timerId);if(txt!==q.ans){say(`❌ 答錯了！正確是「${q.ans}」`,false);el.animate([{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(0)'}],{duration:350});advanceQuestion();return}const r=el.getBoundingClientRect();popStars(r.left+r.width/2,r.top);getPlayer(currentPlayer).stars+=1;save();updateHud();correctCount++;say('✅ '+q.idiom+'　橋板 +1！');attemptCount++;renderBridge();setTimeout(showQuestion,850)}
function failRound(){clearInterval(timerId);say('🌊 這次還沒搭完橋，下次再挑戰！',false);setTimeout(()=>{alert(`本關結束：答對 ${correctCount} 題／共 ${attemptCount} 題。\n今天還能玩 ${idiomRemaining(currentPlayer)} 次。`);$('#selectLayer').style.display='flex';renderPlayers()},900)}
function finishBridge(){clearInterval(timerId);getPlayer(currentPlayer).stars+=3;save();updateHud();say('🌉 答對 5 題！過河獎勵 ⭐ +3');$('#char').classList.add('cross');const used=round.slice(0,Math.max(1,attemptCount));sentenceTarget=used[Math.floor(Math.random()*used.length)]||round[0];setTimeout(()=>{$('#target').textContent=sentenceTarget.idiom;$('#meaning').textContent=sentenceTarget.hint;$('#sentence').style.display='flex'},1550)}
$('#judgeBtn').onclick=()=>{
const text=$('#sentenceInput').value.trim();
const idiom=sentenceTarget.idiom;
const clean=text.replace(/[，。！？、,.!?\s]/g,'');
const withoutIdiom=clean.split(idiom).join('');
let level='retry',msg='',color='#b33';

if(!text.includes(idiom)){
  msg=`🔁 再試一次：句子裡要使用「${idiom}」喔。`;
}else if(clean.length<8 || withoutIdiom.length<4){
  msg='🔁 再試一次：句子太短了，請把「誰、發生什麼事」說清楚。';
}else if(clean.length<14){
  level='close';
  color='#b36b00';
  msg=`🟡 接近了！你有用到「${idiom}」，再多寫一點情境，讓句子的意思更完整。`;
}else{
  level='correct';
  color='#247228';
  msg=`✅ 使用正確！句子完整，也有把「${idiom}」放進自己的情境裡。`;
}

$('#judge').textContent=msg;
$('#judge').style.color=color;
if(level==='correct'){
  $('#judgeBtn').style.display='none';
  $('#nextBtn').style.display='inline-block';
}
};
$('#nextBtn').onclick=()=>{getPlayer(currentPlayer).stars+=5;save();updateHud();alert(`🎉 破關成功！\n答題 5 顆＋搭橋 3 顆＋造句 5 顆＝13 顆星星 ⭐\n今天還能玩 ${idiomRemaining(currentPlayer)} 次。`);$('#selectLayer').style.display='flex';renderPlayers()};
renderPlayers();

</script></body></html>
