<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#63b84f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="九九神射手">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>九九乘法神射手</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--brown:#75461f;--cream:#fff8df;--green:#43a047}
body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#3b2d20}
.screen{display:none;width:100vw;height:100dvh}.screen.on{display:flex}
#start,#result{align-items:center;justify-content:center;padding:20px;background:linear-gradient(#a7e1ff 0 38%,#9bdc72 38%)}
.card{width:min(560px,94vw);background:#fffdf4;border:5px solid var(--brown);border-radius:28px;padding:20px;box-shadow:0 10px 0 #57331655;text-align:center}
h1{margin:3px 0;font-size:28px}.sub{margin:7px 0 17px;color:#6b6258}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;text-align:left}
label{font-size:15px;font-weight:900}select{width:100%;margin-top:5px;padding:12px;border:2px solid #cde7b7;border-radius:13px;background:#fff;font-size:17px}
button{width:100%;margin-top:17px;padding:15px;border:0;border-radius:16px;background:#4da94e;color:#fff;font-size:21px;font-weight:1000;box-shadow:0 5px 0 #337c35}
#game{position:relative;overflow:hidden;background:linear-gradient(#9bdcff 0 48%,#b7e681 48% 100%)}
#treeTop{position:absolute;z-index:1;left:-5%;right:-5%;top:0;height:35vh;background:
radial-gradient(circle at 5% 66%,#3c9e43 0 18%,transparent 18.5%),
radial-gradient(circle at 22% 48%,#58b94f 0 23%,transparent 23.5%),
radial-gradient(circle at 43% 61%,#30913d 0 24%,transparent 24.5%),
radial-gradient(circle at 64% 42%,#60bf50 0 23%,transparent 23.5%),
radial-gradient(circle at 82% 60%,#379d40 0 22%,transparent 22.5%),
radial-gradient(circle at 98% 46%,#55b84c 0 19%,transparent 19.5%),
linear-gradient(#56b84b,#32953c);filter:drop-shadow(0 8px 0 #287e35)}
#trunk{position:absolute;z-index:2;right:-12px;top:22vh;width:100px;height:78vh;background:linear-gradient(90deg,#633719,#a8642c 48%,#70401d);border-left:7px solid #603718;border-radius:50% 15% 0 0}
#branch{position:absolute;z-index:2;right:48px;top:35vh;width:160px;height:38px;background:#895127;border-radius:28px;transform:rotate(-25deg);transform-origin:right}
#hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center}
.hudbox{background:#fffbe9e8;border:3px solid #80532d;border-radius:15px;padding:8px;font-weight:1000}
#score{text-align:right}
#board{min-width:105px;text-align:center;background:#8b5529;color:#fff4d1;border:5px solid #60391d;border-radius:11px;font-size:36px;font-weight:1000;padding:6px 15px;box-shadow:0 5px 0 #4e2e18}
#field{position:absolute;z-index:5;inset:0;overflow:hidden}
.apple{position:absolute;width:72px;height:67px;border-radius:52% 52% 46% 46%;background:radial-gradient(circle at 31% 26%,#ffaca5 0 10%,#f0443d 11% 65%,#b82125 66%);border:4px solid #a52626;color:white;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;text-shadow:0 2px #79181a;box-shadow:0 6px 8px #0002;transition-property:transform;transition-timing-function:linear;will-change:transform}
.apple:before{content:"";position:absolute;width:8px;height:17px;background:#68401d;top:-13px;border-radius:4px}.apple:after{content:"";position:absolute;width:22px;height:12px;background:#45a044;top:-10px;left:40px;border-radius:100% 0;transform:rotate(-28deg)}
.apple.hit{animation:pop .4s ease forwards}@keyframes pop{35%{scale:1.25;rotate:12deg}100%{scale:.05;opacity:0}}
.starburst{position:fixed;z-index:30;font-size:34px;pointer-events:none;animation:stars .65s ease-out forwards}@keyframes stars{to{transform:translateY(-55px) scale(1.6);opacity:0}}
#archer{position:absolute;z-index:10;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center}
#weapon{transform-origin:50% 88%;transition:transform .16s ease}
#weapon.aim{filter:drop-shadow(0 0 8px #fff8a8)}
#weapon.draw .readyArrow{transform:translateY(12px) rotate(-4deg)}
#weapon{position:relative;width:132px;height:122px;background:transparent;border:0;box-shadow:none}
.bowshape{position:absolute;left:20px;top:14px;width:55px;height:82px;border:7px solid #8a522d;border-right:0;border-radius:55px 0 0 55px}
.bowshape:after{content:"";position:absolute;left:43px;top:-3px;width:2px;height:76px;background:#5f5145;transform:rotate(10deg)}
.readyArrow{transition:transform .12s ease;position:absolute;left:59px;top:17px;width:5px;height:78px;background:#6b452b;transform:rotate(-4deg);border-radius:3px}.readyArrow:before{content:"▲";position:absolute;top:-15px;left:-7px;color:#555;font-size:18px}
#base{position:absolute;left:70px;top:35px;min-width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#fff6cf;border:4px solid #80532d;border-radius:50%;font-size:34px;font-weight:1000;box-shadow:0 4px 0 #5f3a2055}
#hint{display:inline-block;margin-top:-2px;padding:4px 11px;background:#fffbe5e8;border-radius:10px;font-size:13px;font-weight:900}
.flyArrow{position:fixed;z-index:25;width:5px;height:82px;background:#68442a;border-radius:3px;transform-origin:center center;transition:left .32s linear,top .32s linear,transform .32s linear}.flyArrow:before{content:"▲";position:absolute;top:-16px;left:-7px;color:#555;font-size:18px}
#floatLayer{position:fixed;inset:0;z-index:45;pointer-events:none}
.floatmsg{position:fixed;z-index:46;padding:7px 12px;border-radius:14px;background:#fffdf2e8;border:3px solid #80532d;font-size:20px;font-weight:1000;white-space:nowrap;animation:floatup .72s ease-out forwards;box-shadow:0 4px 0 #0002}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.85);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-58px) scale(1.05);opacity:0}}
#msg{white-space:pre-line;display:none;position:absolute;z-index:40;left:50%;top:47%;transform:translate(-50%,-50%);min-width:245px;background:#fffdf2;border:5px solid #80532d;border-radius:20px;padding:14px 18px;text-align:center;font-size:25px;line-height:1.25;font-weight:1000;box-shadow:0 8px 0 #0002}
.combo{position:absolute;z-index:21;top:82px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:1000;color:#ffef8a;text-shadow:0 2px #744;display:none}
#result .big{font-size:64px}.stats{font-size:21px;line-height:1.55}

.forestDecor{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fff9;border-radius:60px;width:95px;height:30px;top:31%}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff9;border-radius:50%}
.cloud:before{width:42px;height:42px;left:18px;top:-19px}.cloud:after{width:55px;height:55px;right:10px;top:-27px}
.c1{left:8%;transform:scale(.8)}.c2{right:18%;top:35%;transform:scale(.55)}
.bush{position:absolute;bottom:0;width:180px;height:90px;background:#78c95b;border-radius:90px 90px 0 0;opacity:.65}
.b1{left:-50px}.b2{right:40px;width:130px;height:65px}
.grassline{position:absolute;bottom:0;left:0;right:0;height:24px;background:repeating-linear-gradient(75deg,#72bf4f 0 8px,#9cdb69 8px 16px);opacity:.7}
.apple{z-index:5}
#weapon{z-index:12}
.bowWood{position:absolute;left:24px;top:8px;width:70px;height:104px;border:9px solid #7b4b25;border-right-color:transparent;border-radius:70% 0 0 70%;transform:rotate(-2deg)}
.bowGrip{position:absolute;left:78px;top:46px;width:13px;height:32px;background:#9a5d2d;border-radius:7px;box-shadow:inset 0 0 0 3px #6c3d20}
.bowString{position:absolute;left:87px;top:11px;width:2px;height:98px;background:#55351f;transform-origin:center}
.readyArrow{left:84px!important;top:9px!important;height:100px!important;background:#5d402a!important}
.readyArrow:before{border-left-color:#4c5360!important}
#base{left:84px!important;top:38px!important;background:#fff5c7!important}


.scoreBreak{margin:16px auto 8px;max-width:330px;padding:12px 16px;background:#fff8d9;border:3px solid #80532d;border-radius:18px;text-align:left}
.scoreBreak>div{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;font-size:18px}
.scoreBreak .scoreTotal{border-top:2px dashed #a77a45;margin-top:5px;padding-top:11px;font-size:22px}

.appleBurst{position:fixed;z-index:60;width:1px;height:1px;pointer-events:none}
.appleBurst .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border:7px solid #ffd84d;border-radius:50%;animation:ringPop .42s ease-out forwards}
.appleBurst .piece{position:absolute;left:-20px;top:-20px;width:40px;height:40px;background:#ef3e3e;border:4px solid #b72d2d}
.appleBurst .p1{border-radius:90% 20% 60% 40%;animation:piece1 .58s ease-out forwards}
.appleBurst .p2{border-radius:20% 90% 40% 60%;animation:piece2 .58s ease-out forwards}
.appleBurst .leaf{position:absolute;left:-4px;top:-28px;font-size:24px;animation:leafFly .62s ease-out forwards}
.appleBurst .spark{position:absolute;font-size:22px;animation:sparkFly .55s ease-out forwards}
.appleBurst .s1{left:-8px;top:-12px}.appleBurst .s2{left:8px;top:-4px}.appleBurst .s3{left:-18px;top:4px}
@keyframes ringPop{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes piece1{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(-48px,42px) rotate(-135deg) scale(.65);opacity:0}}
@keyframes piece2{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(52px,38px) rotate(145deg) scale(.65);opacity:0}}
@keyframes leafFly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(25px,-58px) rotate(210deg);opacity:0}}
@keyframes sparkFly{0%{transform:scale(.4);opacity:1}100%{transform:translateY(-45px) scale(1.25);opacity:0}}
.apple.hit{animation:appleImpact .13s linear 2}
@keyframes appleImpact{0%{transform:translateX(0) scale(1)}50%{transform:translateX(7px) scale(1.08)}100%{transform:translateX(-5px) scale(.98)}}


#profileScreen{align-items:center;justify-content:center;padding:20px;background:linear-gradient(#a8ddff 0 42%,#a8df79 42% 100%)}
#profileScreen.on{display:flex}
.profileCard,.parentCard{width:min(560px,94vw);background:#fffdf4;border:5px solid #80532d;border-radius:28px;padding:20px;box-shadow:0 10px 0 #57331655;text-align:center}
.profileTitle{font-size:30px;font-weight:1000;margin:2px 0 4px}
.profileSub{color:#6b6258;margin:0 0 16px}
.nameInput{width:100%;padding:14px;border:3px solid #cde7b7;border-radius:14px;font-size:20px;text-align:center;background:white}
.profileList{display:grid;gap:10px;margin:15px 0}
.profileBtn{margin:0;background:#fff8df;color:#3b2d20;border:3px solid #80532d;box-shadow:none}
.miniRow{display:flex;gap:10px;margin-top:12px}
.miniBtn{margin:0;font-size:16px;padding:11px;background:#8b6b49;box-shadow:0 4px 0 #5d452f}
.rewardBar{margin:12px 0 0;padding:12px;border:3px solid #80532d;border-radius:16px;background:#fff5c8}
.rewardBar b{font-size:26px}
#playerHud{position:absolute;z-index:22;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fffbe9e8;border:3px solid #80532d;border-radius:14px;padding:7px 10px;font-size:13px;font-weight:900}
#playerHud .stars{font-size:16px}
#parentModal,#redeemModal{display:none;position:fixed;inset:0;z-index:200;background:#0008;align-items:center;justify-content:center;padding:18px}
.modalCard{width:min(520px,94vw);background:#fffdf4;border:5px solid #80532d;border-radius:24px;padding:18px;box-shadow:0 10px 0 #0003;text-align:center}
.modalCard input,.modalCard select{width:100%;padding:12px;margin:6px 0 12px;border:2px solid #cde7b7;border-radius:12px;font-size:18px}
.modalButtons{display:flex;gap:10px}.modalButtons button{margin:0}
.secondary{background:#8b6b49;box-shadow:0 5px 0 #5d452f}
.limitWarn{font-size:18px;font-weight:900;color:#a0392d;margin:10px 0}
.resultStars{font-size:42px;letter-spacing:4px;margin:8px 0}
.profileBadge{display:inline-block;padding:6px 12px;border-radius:14px;background:#fff4c7;border:3px solid #80532d;font-weight:900;margin-bottom:8px}


button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#parentModal,#redeemModal{touch-action:manipulation}

.rewardTierGrid{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
.rewardTierCard{border:3px solid #80532d;border-radius:18px;padding:12px;background:#fff8d9;text-align:left}
.rewardTierCard h3{margin:0 0 5px;font-size:20px}
.rewardTierCard .need{font-size:18px;font-weight:1000}
.rewardTierCard .remain{font-size:14px;color:#6b6258;margin-top:3px}
.rewardTierCard button{margin-top:9px;font-size:17px;padding:10px}
.rewardTierCard.locked{opacity:.58}
.rewardTierSettings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0 15px;padding:11px;border:2px dashed #b98a55;border-radius:14px;background:#fffaf0}
.rewardTierSettings .full{grid-column:1/-1;font-weight:1000;text-align:left}
.rewardTierSettings label{font-size:13px;text-align:left}
.rewardTierSettings input{margin-bottom:0!important}
.redeemBalance{font-size:20px;font-weight:1000;margin:8px 0 12px}
.redeemSelected{padding:10px;border-radius:14px;background:#fff0b5;border:3px solid #80532d;margin:10px 0;font-weight:900}


.goalBox{margin-top:12px;padding:12px;border:3px solid #80532d;border-radius:18px;background:#fff8d9;text-align:center}
.goalTitle{font-weight:1000;font-size:18px;margin-bottom:6px}
.goalProgress{height:18px;background:#e7ddbd;border-radius:999px;overflow:hidden;border:2px solid #b98a55}
.goalProgressBar{height:100%;background:#67ad58;width:0%;transition:width .35s ease}
.goalMeta{font-size:15px;margin-top:6px;font-weight:900}
.goalPick{margin-top:8px!important;padding:8px 10px!important;font-size:15px!important}

/* V11.2：COMBO 放到題目木牌下方，避免遮住題目 */
#combo, #comboText, .combo, .comboText, .combo-display, .comboDisplay {
  top: 150px !important;
  bottom: auto !important;
  z-index: 20 !important;
  pointer-events: none !important;
}


/* V11.3：iPhone 禮物兌換操作修正 */
#redeemModal .modalCard{
  max-height: calc(100dvh - 24px) !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch !important;
  padding-bottom: calc(18px + env(safe-area-inset-bottom)) !important;
}
#redeemModal .modalButtons{
  position: sticky !important;
  bottom: 0 !important;
  z-index: 50 !important;
  background: #fffdf4 !important;
  padding: 10px 0 calc(8px + env(safe-area-inset-bottom)) !important;
}
#confirmRedeem, #closeRedeem{
  touch-action: manipulation !important;
  pointer-events: auto !important;
}


/* V11.5：個別玩家家長管理 */
.profileRow{display:flex;gap:8px;align-items:stretch}
.profileRow .profileBtn{flex:1}
.playerManageBtn{width:58px;min-width:58px;padding:8px 2px;border:3px solid #80532d;border-radius:16px;background:#fff5d5;font-size:22px;box-shadow:0 5px 0 #65411f}
#playerManageModal{display:none;position:fixed;inset:0;z-index:260;background:#0008;align-items:center;justify-content:center;padding:18px;touch-action:manipulation}
#playerManageModal .modalCard{max-height:calc(100dvh - 28px);overflow:auto;-webkit-overflow-scrolling:touch}
.manageBtns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.dangerBtn{background:#d85b4f!important;color:#fff!important}

</style></head>
<body>

<section id="profileScreen" class="screen on">
  <div class="profileCard">
    <div class="profileTitle">⭐ 九九乘法神射手</div>
    <p class="profileSub">先選自己的名字，星星才會存進自己的帳號喔！</p>
    <div id="profileList" class="profileList"></div>
    <input id="newName" class="nameInput" maxlength="12" placeholder="輸入小朋友名字">
    <button id="createProfileBtn">建立 / 進入遊戲</button>
    <div class="miniRow">
      <button id="parentBtn" class="miniBtn">🔒 家長設定</button>
      <button id="redeemBtn" class="miniBtn">🎁 兌換禮物</button>
    </div>
    <div id="profileSummary" class="rewardBar">尚未選擇玩家</div>
    <div id="goalBox" class="goalBox" style="display:none">
      <div class="goalTitle" id="goalTitle">🎯 尚未設定願望目標</div>
      <div class="goalProgress"><div id="goalProgressBar" class="goalProgressBar"></div></div>
      <div class="goalMeta" id="goalMeta">到「兌換禮物」選一個想存到的禮物吧！</div>
    </div>
  </div>
</section>

<section id="start" class="screen"><div class="card">
<h1>🍎 九九乘法神射手 🏹</h1><p class="sub">看木牌答案，用弓箭射中正確的蘋果！</p>
<div class="grid">
<label>乘法範圍<select id="table"><option value="all">2～9 全部</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label>
<label>題目數<select id="total"><option>10</option><option>20</option><option>30</option></select></label>
<label>掉落秒數<select id="speed"><option value="8">8 秒（慢）</option><option value="5" selected>5 秒（中）</option><option value="3">3 秒（快）</option></select></label>
<label>蘋果數<select id="num"><option value="3">3 顆</option><option value="4">4 顆</option><option value="5" selected>5 顆</option></select></label>
</div>
<div id="starPreview" style="margin:12px 0 2px;padding:10px 12px;background:#fff8d9;border:3px solid #80532d;border-radius:16px;font-weight:900;font-size:17px">
⭐ 本局全對預計可得 <b id="maxEarnStars">—</b> 顆
</div>
<button id="go">開始冒險 ▶</button><button id="switchPlayer" class="secondary" style="margin-top:10px">👧 切換玩家</button></div></section>

<section id="game" class="screen"><div id="treeTop"></div><div id="branch"></div><div id="trunk"></div>
<div id="hud"><div id="progress" class="hudbox">第 1 / 10 題</div><div id="board">21</div><div id="score" class="hudbox">⭐ 0</div></div>
<div id="combo" class="combo">🔥 COMBO ×2</div>
<div class="forestDecor" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="bush b1"></div><div class="bush b2"></div>
  <div class="grassline"></div>
</div>
<div id="field"></div><div id="floatLayer"></div><div id="msg"></div>
<div id="playerHud"></div><div id="archer"><div id="weapon"><div class="bowWood"></div><div class="bowString"></div><div class="bowGrip"></div><div class="bowshape"></div><div class="readyArrow"></div><div id="base">3</div></div><div id="hint">點蘋果射擊！</div></div></section>

<section id="result" class="screen"><div class="card"><div class="big">🏆</div><h1>挑戰完成！</h1><div id="stats" class="stats"></div><button id="again">再玩一次</button></div></section>

<div id="playerManageModal">
  <div class="modalCard">
    <h2>🔐 個人玩家管理</h2>
    <div id="managePlayerName" style="font-size:24px;font-weight:900;margin:10px 0 16px"></div>
    <input id="managePin" inputmode="numeric" maxlength="6" placeholder="請輸入家長 PIN">
    <div class="manageBtns">
      <button type="button" id="resetPlayerPlays">🔄 重置這位小朋友今天次數</button>
      <button type="button" id="deletePlayer" class="dangerBtn">🗑️ 刪除這位小朋友</button>
      <button type="button" id="closePlayerManage" class="secondary">取消</button>
    </div>
    <div class="small" style="margin-top:12px">只處理目前選到的這一位，不影響其他小朋友。</div>
  </div>
</div>

<div id="parentModal">
  <div class="modalCard">
    <h2>🔒 家長設定</h2>
    <input id="parentPin" inputmode="numeric" maxlength="6" placeholder="家長 PIN">
    <div id="parentSettings" style="display:none">
      <label>每天可玩次數
        <select id="dailyLimit"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      </label>
      <div class="rewardTierSettings">
        <div class="full">🎁 三階禮物設定</div>
        <label>小禮物名稱
          <input id="smallRewardName" maxlength="20" value="小禮物">
        </label>
        <label>需要星星
          <input id="smallRewardCost" type="number" min="1" max="9999" value="50">
        </label>
        <label>中禮物名稱
          <input id="mediumRewardName" maxlength="20" value="中禮物">
        </label>
        <label>需要星星
          <input id="mediumRewardCost" type="number" min="1" max="9999" value="150">
        </label>
        <label>大禮物名稱
          <input id="largeRewardName" maxlength="20" value="大禮物">
        </label>
        <label>需要星星
          <input id="largeRewardCost" type="number" min="1" max="9999" value="300">
        </label>

  <div class="modalCard">
    <h2>🎁 星星兌換中心</h2>
    <div id="redeemInfo"></div>
    <div id="rewardChoices" class="rewardTierGrid"></div>
    <div id="redeemSelection" class="redeemSelected" style="display:none"></div>
    <input id="redeemPin" inputmode="numeric" maxlength="6" placeholder="選好禮物後，請家長輸入 PIN">
    <div class="modalButtons"><button type="button" id="confirmRedeem" disabled style="opacity:.5">確認兌換</button><button type="button" id="closeRedeem" class="secondary">取消</button></div>
  </div>
</div>


<script>
const $=s=>document.querySelector(s);
const STORE_KEY='mathArcherV8';
let currentPlayer=null;

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {settings:{dailyLimit:3,pin:'2580',rewards:{
      small:{name:'小禮物',cost:50},
      medium:{name:'中禮物',cost:150},
      large:{name:'大禮物',cost:300}
    }},players:{}};
}
function saveStore(){ localStorage.setItem(STORE_KEY,JSON.stringify(store)); }
let store=loadStore();
function ensureRewardSettings(){
  if(!store.settings) store.settings={};
  if(!store.settings.rewards){
    // 舊版資料自動升級：原本的單一禮物保留為「小禮物」。
    const oldCost=Math.max(1,+store.settings.rewardCost||50);
    const oldName=(store.settings.rewardName||'小禮物');
    store.settings.rewards={
      small:{name:oldName,cost:oldCost},
      medium:{name:'中禮物',cost:Math.max(oldCost+1,150)},
      large:{name:'大禮物',cost:Math.max(oldCost+2,300)}
    };
  }
  const d={small:['小禮物',50],medium:['中禮物',150],large:['大禮物',300]};
  for(const k of ['small','medium','large']){
    if(!store.settings.rewards[k]) store.settings.rewards[k]={name:d[k][0],cost:d[k][1]};
    store.settings.rewards[k].name=(store.settings.rewards[k].name||d[k][0]).trim();
    store.settings.rewards[k].cost=Math.max(1,+store.settings.rewards[k].cost||d[k][1]);
  }
  if(!store.settings.pin) store.settings.pin='2580';
  if(!store.settings.dailyLimit) store.settings.dailyLimit=3;
}
ensureRewardSettings();
saveStore();

function getPlayer(name){
  if(!store.players[name]){
    store.players[name]={stars:0,plays:{},redeemed:0};
    saveStore();
  }
  return store.players[name];
}
function playsToday(name){
  const p=getPlayer(name); return p.plays[todayKey()]||0;
}
function remainingPlays(name){
  return Math.max(0,(+store.settings.dailyLimit||3)-playsToday(name));
}

function renderGoal(){
  const box=$('#goalBox');
  if(!currentPlayer){box.style.display='none';return;}
  const p=getPlayer(currentPlayer);
  box.style.display='block';
  const tier=p.goalTier;
  if(!tier || !store.settings.rewards[tier]){
    $('#goalTitle').textContent='🎯 尚未設定願望目標';
    $('#goalMeta').textContent='到「兌換禮物」選一個想存到的禮物吧！';
    $('#goalProgressBar').style.width='0%';
    return;
  }
  const icons={small:'🎁',medium:'🎀',large:'🏆'};
  const item=store.settings.rewards[tier];
  const pct=Math.max(0,Math.min(100,Math.round((p.stars/item.cost)*100)));
  const left=Math.max(0,item.cost-p.stars);
  $('#goalTitle').textContent=`${icons[tier]} 我的目標：${item.name}`;
  $('#goalMeta').textContent=p.stars>=item.cost
    ? `⭐ ${p.stars} / ${item.cost}　達成目標！可以兌換了 🎉`
    : `⭐ ${p.stars} / ${item.cost}　還差 ${left} 顆！`;
  $('#goalProgressBar').style.width=pct+'%';
}

function renderProfiles(){
  const box=$('#profileList'); box.innerHTML='';
  Object.keys(store.players).forEach(name=>{
    const row=document.createElement('div'); row.className='profileRow';
    const b=document.createElement('button');
    b.className='profileBtn';
    b.textContent=`👧 ${name}　⭐ ${store.players[name].stars}　今天剩 ${remainingPlays(name)} 次`;
    b.onclick=()=>selectPlayer(name);
    const m=document.createElement('button');
    m.type='button'; m.className='playerManageBtn'; m.textContent='⚙️'; m.title='家長管理';
    m.onclick=(ev)=>{ev.stopPropagation();openPlayerManage(name);};
    row.appendChild(b); row.appendChild(m); box.appendChild(row);
  });
  updateProfileSummary();
}
function updateProfileSummary(){
  const s=$('#profileSummary');
  if(!currentPlayer){s.innerHTML='尚未選擇玩家';return;}
  const p=getPlayer(currentPlayer);
  const r=store.settings.rewards;
  s.innerHTML=`<span class="profileBadge">${currentPlayer}</span><br>⭐ 累積星星 <b>${p.stars}</b> 顆<br>🎮 今天還能玩 <b>${remainingPlays(currentPlayer)}</b> 次<br>🎁 小 ${r.small.cost} ／ 中 ${r.medium.cost} ／ 大 ${r.large.cost} 顆星`;
}
function selectPlayer(name){
  currentPlayer=name;
  updateProfileSummary();
  show('#start');
  setTimeout(updateStartStatus,0);
}
function updateStartStatus(){
  if(!currentPlayer)return;
  const left=remainingPlays(currentPlayer);
  const btn=$('#go');
  if(left<=0){
    btn.disabled=true;btn.textContent='今天次數用完囉！明天再來 ⭐';btn.style.opacity='.55';
  }else{
    btn.disabled=false;btn.textContent=`開始冒險 ▶（今天剩 ${left} 次）`;btn.style.opacity='1';
  }
  const hud=$('#playerHud');
  if(hud) hud.innerHTML=`👧 ${currentPlayer}<br><span class="stars">⭐ ${getPlayer(currentPlayer).stars}</span>`;
  updateStarPreview();
}
function consumePlay(){
  if(!currentPlayer || remainingPlays(currentPlayer)<=0) return false;
  const p=getPlayer(currentPlayer),k=todayKey();
  p.plays[k]=(p.plays[k]||0)+1; saveStore(); updateStartStatus(); return true;
}
function difficultyStarCap(){
  const table=$('#table').value;
  const t=+$('#total').value, s=+$('#speed').value, apples=+$('#num').value;
  // Designed so the absolute hardest setting (2–9 all, 30 questions, 3 sec, 5 apples)
  // awards 35 stars for a perfect round.
  const rangeMap = {
    '2':1,
    '3':2,
    '4':3,
    '5':2,
    '6':4,
    '7':5,
    '8':5,
    '9':4,
    'all':8
  };
  const rangePts = rangeMap[table] ?? 1;
  const questionPts = t===30 ? 8 : (t===20 ? 5 : 2);
  const speedPts = s===3 ? 8 : (s===5 ? 5 : 2);
  const applePts = apples===5 ? 6 : (apples===4 ? 4 : 2);
  return 5 + rangePts + questionPts + speedPts + applePts; // min 13, max 35
}
function awardStarsForResult(pct){
  const cap=difficultyStarCap();
  // Stars scale with both accuracy and selected difficulty.
  // Under 60% earns none; 100% earns the full displayed cap.
  let earned = pct<60 ? 0 : Math.max(1, Math.round(cap * pct / 100));
  const p=getPlayer(currentPlayer); p.stars+=earned; saveStore(); return earned;
}
function updateStarPreview(){
  const el=$('#maxEarnStars');
  if(el) el.textContent=difficultyStarCap();
}

let total=10,speed=5,n=5,q=0,score=0,baseScore=0,comboBonus=0,correct=0,answer=0,locked=false,shotInFlight=false,timer,combo=0,wrongAttempts=0;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){for(let i=a.length-1;i;i--){let j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
 $(id).classList.add('on');
 window.scrollTo(0,0);
}
function question(){
 wrongAttempts=0;
 shotInFlight=false;
 $('#msg').style.display='none';$('#msg').innerText='';
 locked=false;clearTimeout(timer);$('#field').innerHTML='';$('#msg').style.display='none';
 const pick=$('#table').value,a=pick==='all'?rnd(2,9):+pick,b=rnd(2,9);answer=b;
 $('#base').textContent=a;$('#board').textContent=a*b;$('#progress').textContent=`第 ${q+1} / ${total} 題`;$('#score').textContent=`⭐ ${score}`;
 let vals=[b];while(vals.length<n){let x=rnd(2,9);if(!vals.includes(x))vals.push(x)}shuffle(vals);
 const lanes=shuffle([10,27,44,61,78].slice(0,n));
 vals.forEach((v,k)=>{
   let e=document.createElement('div');e.className='apple';e.textContent=v;
   e.style.left=`calc(${lanes[k]}% - 36px)`;e.style.top=(22+rnd(0,9))+'vh';
   e.dataset.fall=(speed+rnd(0,8)/10).toFixed(1);e.style.transitionDuration=e.dataset.fall+'s';
   e.style.transitionDelay=(k*.11)+'s';e.onclick=()=>shoot(e,v);$('#field').appendChild(e);
   requestAnimationFrame(()=>requestAnimationFrame(()=>e.style.transform='translateY(calc(100dvh - 53vh))'));
 });
 const correctApple=[...document.querySelectorAll('.apple')].find(x=>+x.textContent===answer);
 const fallTime=correctApple ? (+correctApple.dataset.fall + .15) : speed;
 timer=setTimeout(miss,fallTime*1000);
}
function floatMsg(text,x,y){
 let f=document.createElement('div');f.className='floatmsg';f.textContent=text;
 f.style.left=x+'px';f.style.top=y+'px';$('#floatLayer').appendChild(f);
 setTimeout(()=>f.remove(),760);
}
function clearApples(){
 document.querySelectorAll('.apple').forEach(a=>{a.style.transition='opacity .22s ease, transform .22s ease';a.style.opacity='0';a.style.transform+=' scale(.65)'});
}
function shoot(e,v){
 if(locked || shotInFlight)return;
 shotInFlight=true;
 const r=e.getBoundingClientRect(),w=$('#weapon').getBoundingClientRect(),weapon=$('#weapon');
 const sx=w.left+w.width/2,sy=w.top+8,tx=r.left+r.width/2,ty=r.top+r.height/2;
 const dx=tx-sx,dy=ty-sy,ang=Math.atan2(dy,dx)*180/Math.PI+90;
 weapon.style.transform=`rotate(${Math.max(-22,Math.min(22,ang))}deg)`;
 weapon.classList.add('aim','draw');
 setTimeout(()=>{
   let ar=document.createElement('div');ar.className='flyArrow';
   ar.style.left=(sx-2)+'px';ar.style.top=(sy-40)+'px';ar.style.transform=`rotate(${ang}deg)`;
   document.body.appendChild(ar);
   requestAnimationFrame(()=>{ar.style.left=(tx-2)+'px';ar.style.top=(ty-40)+'px'});
   setTimeout(()=>{
     weapon.classList.remove('draw','aim');weapon.style.transform='';
     if(v===answer){
       locked=true;clearTimeout(timer);correct++;combo++;baseScore+=10;const bonus=(combo>=3?5:0);comboBonus+=bonus;score=baseScore+comboBonus;
       e.classList.add('hit');$('#score').textContent=`⭐ ${score}`;showCombo();
       setTimeout(()=>{burstApple(tx,ty,e);stars(tx,ty)},115);
       floatMsg(bonus>0?'🔥 神射手！ +15':'🎯 答對 +10',tx,ty);
       setTimeout(()=>ar.remove(),160);
       setTimeout(()=>{clearApples();q++;setTimeout(()=>q>=total?finish():question(),260)},650);
     }else{
       combo=0;showCombo();ar.style.opacity='0';setTimeout(()=>ar.remove(),100);
       e.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:220});
       wrongAttempts++;
       if(wrongAttempts===1){
         floatMsg('💨 再試一次！',tx,ty);
         shotInFlight=false;
       }else{
         locked=true;clearTimeout(timer);
         floatMsg(`🍎 正確答案是 ${answer}`,tx,ty);
         setTimeout(()=>{
           clearApples();
           q++;
           setTimeout(()=>q>=total?finish():question(),260);
         },650);
       }
     }
   },330);
 },130);
}
function burstApple(x,y,e){
 e.style.opacity='0';
 let b=document.createElement('div');b.className='appleBurst';
 b.style.left=x+'px';b.style.top=y+'px';
 b.innerHTML='<i class="ring"></i><i class="piece p1"></i><i class="piece p2"></i><span class="leaf">🍃</span><span class="spark s1">⭐</span><span class="spark s2">✨</span><span class="spark s3">⭐</span>';
 document.body.appendChild(b);
 if(navigator.vibrate) navigator.vibrate(25);
 setTimeout(()=>b.remove(),700);
}
function stars(x,y){for(let i=0;i<4;i++){let s=document.createElement('div');s.className='starburst';s.textContent='⭐';s.style.left=(x+rnd(-28,28))+'px';s.style.top=(y+rnd(-15,15))+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}
function showCombo(){let c=$('#combo');if(combo>=2){c.textContent=`🔥 COMBO ×${combo}`;c.style.display='block'}else c.style.display='none'}
function miss(){
 if(locked)return;locked=true;combo=0;showCombo();clearTimeout(timer);
 clearApples();
 let m=$('#msg');m.innerText=`🍎 太可惜了！\n正確答案是 ${answer}`;m.style.display='block';
 setTimeout(()=>{q++;q>=total?finish():question()},720);
}
function finish(){
 let p=Math.round(correct/total*100);
 const earned=awardStarsForResult(p);
 const totalStars=getPlayer(currentPlayer).stars;
 $('#stats').innerHTML=`
   答對 <b>${correct}</b> 題／共 <b>${total}</b> 題<br>
   正確率 <b>${p}%</b>
   <div class="resultStars">${earned?('⭐'.repeat(earned)):'🌱'}</div>
   <b>${earned?`這次獲得 ${earned} 顆星星！`:'這次還沒有拿到星星，再加油！'}</b>
   <div class="scoreBreak">
     <div><span>🎯 基本分</span><b>${baseScore} 分</b></div>
     <div><span>🔥 COMBO 獎勵</span><b>+${comboBonus} 分</b></div>
     <div class="scoreTotal"><span>⭐ 遊戲總分</span><b>${score} 分</b></div>
   </div>
   ⭐ 累積星星 <b>${totalStars}</b> 顆<br>
   🎁 小禮物 ${store.settings.rewards.small.cost} ／ 中禮物 ${store.settings.rewards.medium.cost} ／ 大禮物 ${store.settings.rewards.large.cost} 顆星<br>
   🎮 今天還能玩 <b>${remainingPlays(currentPlayer)}</b> 次<br>
   ${p===100?'🌟 完美神射手！':p>=80?'👏 射得真準！':'💪 再挑戰一次！'}
 `;
 show('#result');
 renderProfiles();
}

$('#createProfileBtn').onclick=()=>{
  const name=$('#newName').value.trim();
  if(!name){alert('請先輸入名字 😄');return;}
  getPlayer(name); currentPlayer=name; saveStore(); renderProfiles(); selectPlayer(name);
};

let managingPlayerName=null;
function openPlayerManage(name){
  managingPlayerName=name;
  $('#managePlayerName').textContent='👧 '+name;
  $('#managePin').value='';
  $('#playerManageModal').style.display='flex';
  setTimeout(()=>$('#managePin').focus(),100);
}
function closePlayerManage(){
  $('#playerManageModal').style.display='none';
  $('#managePin').value='';
  managingPlayerName=null;
}
function managePinOK(){
  if($('#managePin').value!==String(store.settings.pin||'2580')){
    alert('家長 PIN 不正確');
    $('#managePin').focus();
    return false;
  }
  return true;
}
$('#closePlayerManage').onclick=closePlayerManage;
$('#resetPlayerPlays').onclick=()=>{
  if(!managingPlayerName || !managePinOK())return;
  const p=getPlayer(managingPlayerName);
  p.plays[todayKey()]=0;
  saveStore();
  alert(`✅ ${managingPlayerName} 今天的遊戲次數已重置！\n⭐ 星星保留 ${p.stars} 顆`);
  closePlayerManage();
  renderProfiles();
  if(currentPlayer) updateStartStatus();
};
$('#deletePlayer').onclick=()=>{
  if(!managingPlayerName || !managePinOK())return;
  const name=managingPlayerName;
  if(!confirm(`確定刪除「${name}」嗎？\n\n會刪除他的星星、遊戲次數與願望目標。`))return;
  delete store.players[name];
  if(currentPlayer===name) currentPlayer=null;
  saveStore();
  closePlayerManage();
  renderProfiles();
  updateProfileSummary();
  alert(`🗑️ 已刪除 ${name}`);
};

$('#parentBtn').onclick=()=>{
  $('#parentModal').style.display='flex';
  $('#parentSettings').style.display='none';
  $('#parentPin').value='';
  $('#newPin').value='';
  $('#dailyLimit').value=String(store.settings.dailyLimit||3);
  const r=store.settings.rewards;
  $('#smallRewardName').value=r.small.name; $('#smallRewardCost').value=r.small.cost;
  $('#mediumRewardName').value=r.medium.name; $('#mediumRewardCost').value=r.medium.cost;
  $('#largeRewardName').value=r.large.name; $('#largeRewardCost').value=r.large.cost;
};
$('#closeParent').onclick=()=>$('#parentModal').style.display='none';
$('#unlockParent').onclick=()=>{
  if($('#parentPin').value===String(store.settings.pin||'2580')){
    $('#parentSettings').style.display='block';
  }else alert('PIN 不正確');
};
$('#saveParent').onclick=()=>{
  store.settings.dailyLimit=+$('#dailyLimit').value;
  const smallCost=Math.max(1,+$('#smallRewardCost').value||50);
  const mediumCost=Math.max(1,+$('#mediumRewardCost').value||150);
  const largeCost=Math.max(1,+$('#largeRewardCost').value||300);
  if(!(smallCost < mediumCost && mediumCost < largeCost)){
    alert('星星門檻要依序是：小禮物 < 中禮物 < 大禮物 😄');
    return;
  }
  store.settings.rewards={
    small:{name:$('#smallRewardName').value.trim()||'小禮物',cost:smallCost},
    medium:{name:$('#mediumRewardName').value.trim()||'中禮物',cost:mediumCost},
    large:{name:$('#largeRewardName').value.trim()||'大禮物',cost:largeCost}
  };
  const np=$('#newPin').value.trim();
  if(np){
    if(!/^\d{4,6}$/.test(np)){alert('PIN 請輸入 4～6 位數字');return;}
    store.settings.pin=np;
  }
  saveStore(); renderProfiles(); updateStartStatus();
  alert('家長設定已儲存 👍'); $('#parentModal').style.display='none';
};
let selectedRewardTier=null;

function renderRewardChoices(){
  if(!currentPlayer)return;
  const p=getPlayer(currentPlayer),r=store.settings.rewards;
  $('#redeemInfo').innerHTML=`<div class="redeemBalance"><b>${currentPlayer}</b>　⭐ 目前 ${p.stars} 顆</div><div>想現在換小禮物，還是繼續存到更大的禮物呢？ 😆</div>`;
  const labels={small:['🎁','小禮物'],medium:['🎀','中禮物'],large:['🏆','大禮物']};
  $('#rewardChoices').innerHTML='';
  for(const tier of ['small','medium','large']){
    const item=r[tier],enough=p.stars>=item.cost;
    const card=document.createElement('div');
    card.className='rewardTierCard'+(enough?'':' locked');
    const left=Math.max(0,item.cost-p.stars);
    card.innerHTML=`
      <h3>${labels[tier][0]} ${labels[tier][1]}：${item.name}${p.goalTier===tier?'　🎯':''}</h3>
      <div class="need">⭐ 需要 ${item.cost} 顆</div>
      <div class="remain">${enough?`兌換後會剩 ${p.stars-item.cost} 顆`:`還差 ${left} 顆星星`}</div>
      <button class="goalPick" data-goal="${tier}">${p.goalTier===tier?'🎯 目前目標':'🎯 設成我的目標'}</button>
      <button ${enough?'':'disabled'} data-tier="${tier}" style="${enough?'':'opacity:.45'}">${enough?'選這個禮物':'星星還不夠'}</button>`;
    $('#rewardChoices').appendChild(card);
  }
  $('#rewardChoices').querySelectorAll('button[data-goal]').forEach(btn=>{
    btn.onclick=()=>{
      const tier=btn.dataset.goal;
      const p=getPlayer(currentPlayer),item=r[tier];
      p.goalTier=tier;
      saveStore();
      renderGoal();
      renderRewardChoices();
      alert(`🎯 已把「${item.name}」設成願望目標！\n繼續存星星吧 😆`);
    };
  });
  $('#rewardChoices').querySelectorAll('button[data-tier]').forEach(btn=>{
    btn.onclick=()=>{
      selectedRewardTier=btn.dataset.tier;
      const item=r[selectedRewardTier];
      $('#redeemSelection').style.display='block';
      $('#redeemSelection').innerHTML=`已選擇：<b>${item.name}</b><br>將扣除 ⭐ ${item.cost} 顆`;
      $('#confirmRedeem').disabled=false;$('#confirmRedeem').style.opacity='1';
      $('#redeemPin').focus();
      $('#confirmRedeem').disabled=false;
      $('#confirmRedeem').style.opacity='1';
      $('#confirmRedeem').style.pointerEvents='auto';
    };
  });
}
$('#redeemBtn').onclick=()=>{
  if(!currentPlayer){alert('請先選擇小朋友名字');return;}
  selectedRewardTier=null;
  $('#redeemSelection').style.display='none';
  $('#redeemPin').value='';
  $('#confirmRedeem').disabled=true;$('#confirmRedeem').style.opacity='.5';
  renderRewardChoices();
  $('#redeemModal').style.display='flex';
};
$('#redeemPin').addEventListener('input',()=>{
  if(selectedRewardTier){
    $('#confirmRedeem').disabled=false;
    $('#confirmRedeem').style.opacity='1';
    $('#confirmRedeem').style.pointerEvents='auto';
  }
});

$('#closeRedeem').onclick=()=>{$('#redeemModal').style.display='none';selectedRewardTier=null};
$('#confirmRedeem').onclick=()=>{
  if(!selectedRewardTier){alert('請先選擇要兌換的禮物 😄');return;}
  if($('#redeemPin').value!==String(store.settings.pin||'2580')){alert('PIN 不正確');return;}
  const p=getPlayer(currentPlayer),item=store.settings.rewards[selectedRewardTier];
  if(p.stars<item.cost){alert(`星星還不夠喔！還差 ${item.cost-p.stars} 顆 ⭐`);renderRewardChoices();return;}
  p.stars-=item.cost;
  if(typeof p.redeemed!=='object') p.redeemed={small:0,medium:0,large:0};
  p.redeemed[selectedRewardTier]=(p.redeemed[selectedRewardTier]||0)+1;
  saveStore();
  $('#redeemModal').style.display='none';
  renderProfiles();updateStartStatus();renderGoal();
  alert(`🎉 兌換成功！\n已扣除 ${item.cost} 顆星星。\n剩下 ⭐ ${p.stars} 顆。\n請家長準備「${item.name}」 😆`);
  selectedRewardTier=null;
};

$('#switchPlayer').onclick=()=>{show('#profileScreen');renderProfiles()};
$('#go').onclick=()=>{if(!consumePlay()){alert('今天的遊戲次數用完囉！明天再來 😆');return;}total=+$('#total').value;speed=+$('#speed').value;n=+$('#num').value;q=score=baseScore=comboBonus=correct=combo=0;show('#game');question()}
$('#again').onclick=()=>{if(currentPlayer&&remainingPlays(currentPlayer)>0){show('#start');updateStartStatus()}else{show('#profileScreen');renderProfiles()}}

// V8.1 iPhone Safari parent-modal hardening
['closeParent','unlockParent','saveParent','closeRedeem','confirmRedeem'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.style.pointerEvents='auto';
});

['table','total','speed','num'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('change',updateStarPreview);
});
updateStarPreview();
renderProfiles();
renderGoal();
</script>
</body></html>
